[build]
  command = "npm install @11ty/eleventy && ./node_modules/.bin/eleventy"
  publish = "_site"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"

# Old domain retired 2026-07-30. Everything on robertsonconsulting.ca
# now 301s to the matching path on robertsongroup.ca.
[[redirects]]
  from = "https://robertsonconsulting.ca/*"
  to = "https://www.robertsongroup.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.robertsonconsulting.ca/*"
  to = "https://www.robertsongroup.ca/:splat"
  status = 301
  force = true

# Canonical host is www.
[[redirects]]
  from = "https://robertsongroup.ca/*"
  to = "https://www.robertsongroup.ca/:splat"
  status = 301
  force = true

# Pillar pages were indexed without the .html extension on the old domain.
# Rebuilt 2026-08-12; these keep the indexed URLs resolving. (2026-08-12)

[[redirects]]
  from = "/business-coach"
  to = "/business-coach.html"
  status = 301

[[redirects]]
  from = "/business-strategy"
  to = "/business-strategy.html"
  status = 301

[[redirects]]
  from = "/business-growth"
  to = "/business-growth.html"
  status = 301

[[redirects]]
  from = "/business-operations"
  to = "/business-operations.html"
  status = 301
